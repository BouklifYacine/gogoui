name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the secret scan reads every commit, and the
          # changeset check compares the branch with origin/main.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Secrets in any commit (gitleaks; known false positives in .gitleaksignore)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --gitleaks-ignore-path /repo/.gitleaksignore --redact --no-banner
      - name: Vulnerable dependencies (high or critical fail)
        run: bun run audit
      - name: A changeset when packages/ui changes (run `bun run changeset`)
        if: github.event_name == 'pull_request'
        run: bun run changeset:status
      - name: Lint (oxlint, any warning fails)
        run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - name: Dead files, exports and dependencies (knip)
        run: bun run knip
      - name: Chromium for the story tests
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium
      - name: Tests (unit, then every story in light and dark with axe)
        run: bun run test
      - run: bun run build
      - name: The packed package (publint, then attw on every entry point)
        run: bun run check:package
      - name: Size budgets (size-limit)
        run: bun run size
      - run: bun run build-storybook
